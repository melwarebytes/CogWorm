# CogWorm Experiment: Real LLM — Groq GPT-OSS 20B, Linear topology
experiment:
  name: groq_gptoss20b_linear
  topology: linear
  agents: 5
  agent_roles:
    - orchestrator
    - doc_retrieval
    - email_drafting
    - database_query
    - code_execution
  model: "groq:openai/gpt-oss-20b"
  signal_type: static
  cycles: 10
  seed: 42
  defenses: []
