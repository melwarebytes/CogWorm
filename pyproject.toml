[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cogworm"
version = "0.1.0"
description = "A controlled benchmark and simulation platform for studying adversarial instruction propagation in multi-agent AI systems"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.1",
    "pydantic>=2.0",
    "rich>=13.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.30",
    "openai>=1.0",
]
dashboard = [
    "streamlit>=1.28",
    "pyvis>=0.3",
    "plotly>=5.18",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
]

[project.scripts]
cogworm = "cogworm.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cogworm*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
